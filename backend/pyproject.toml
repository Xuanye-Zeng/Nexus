[project]
name = "nexus-backend"
version = "1.4.0"
description = "Multi-agent personal job-search assistant — backend"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Xuanye Zeng", email = "zeng.xuan@northeastern.edu" }]

dependencies = [
    # FastAPI + ASGI
    "fastapi>=0.118",
    "uvicorn[standard]>=0.32",

    # DB
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pgvector>=0.4",
    "greenlet>=3.1",                # required for SQLAlchemy async

    # Config
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",

    # HTTP + connectors
    "httpx>=0.28",
    "aiohttp>=3.11",                # langchain-ollama uses this under the hood

    # LLM stack
    "langchain>=1.0",
    "langchain-core>=1.0",
    "langchain-groq>=0.4",
    "langchain-ollama>=0.4",
    "langgraph>=1.0",

    # M2 — DOL OFLC LCA xlsx ingest
    "pandas>=2.2",
    "openpyxl>=3.1",

    # E — Celery 6h auto-ingest
    "celery>=5.4",
    "redis>=5.2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Tell setuptools where the package lives — backend/ is not nested under a
# top-level package directory; the modules are siblings of pyproject.toml.
[tool.setuptools]
py-modules = [
    "main",
    "config",
    "db",
    "celery_app",
    "tasks",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "agents*",
    "connectors*",
    "models*",
    "routers*",
    "scripts*",
    "services*",
    "tools*",
]
exclude = ["venv*", "alembic*", "fixtures*", "prompts*", "data*"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
    "E501",   # line length handled by formatter
    "B905",   # zip-without-strict — cosine/embed loops don't need strict on aligned pairs
]

# Per-file overrides for legitimate idioms ruff flags by default.
[tool.ruff.lint.per-file-ignores]
# celery_app / tasks / tests inject backend/ into sys.path BEFORE imports
# because macOS Python 3.13+ spawns rather than forks workers; without it,
# `from scripts.ingest_jobs import main` ImportError's in the forked process.
"celery_app.py" = ["E402"]
"tasks.py" = ["E402"]
"tests/conftest.py" = ["E402"]
# FastAPI's documented dep-injection idiom IS Depends() in a default arg.
"routers/*.py" = ["B008"]
# Scripts run as __main__ — argparse calls in defaults are fine.
"scripts/*.py" = ["B008"]
